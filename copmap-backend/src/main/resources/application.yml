spring:
  application:
    name: copmap-backend

  datasource:
    url: jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:copmap}
    username: ${DB_USER:copmap}
    password: ${DB_PASS:copmap123}
    hikari:
      maximum-pool-size: 20
      minimum-idle: 5
      connection-timeout: 30000

  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: false
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
        format_sql: true
        default_schema: public

  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: true

  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
      password: ${REDIS_PASSWORD:}
      timeout: 5000ms
      lettuce:
        pool:
          max-active: 16
          max-idle: 8
          min-idle: 2

  mail:
    host: ${MAIL_HOST:smtp.gmail.com}
    port: ${MAIL_PORT:587}
    username: ${MAIL_USER:}
    password: ${MAIL_PASS:}
    properties:
      mail:
        smtp:
          auth: true
          starttls:
            enable: true

  security:
    jwt:
      secret: ${JWT_SECRET:copmap-secret-key-must-be-at-least-256-bits-long-for-hs256}
      expiration-ms: ${JWT_EXPIRY_MS:86400000}  # 24 hours
      refresh-expiration-ms: ${JWT_REFRESH_EXPIRY_MS:604800000}  # 7 days

server:
  port: ${SERVER_PORT:8080}
  error:
    include-message: always
    include-binding-errors: always

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics,prometheus
  endpoint:
    health:
      show-details: when-authorized
  health:
    mail:
      enabled: false

logging:
  level:
    in.copmap: DEBUG
    org.springframework.security: INFO
    org.hibernate.SQL: INFO

app:
  cors:
    allowed-origins: ${CORS_ORIGINS:http://localhost:3000,http://localhost:4200}
  location:
    # TTL for officer location cache in Redis (seconds)
    cache-ttl: 300
    # Stale threshold — alert if no ping in this many seconds
    stale-threshold: 120
  notification:
    mock-mode: ${NOTIFICATION_MOCK:true}  # when true, log instead of sending
