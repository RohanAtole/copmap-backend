spring:
  datasource:
    url: jdbc:h2:mem:copmap_test;DB_CLOSE_DELAY=-1;MODE=PostgreSQL
    driver-class-name: org.h2.Driver
    username: sa
    password:
  jpa:
    hibernate:
      ddl-auto: create-drop
    properties:
      hibernate:
        dialect: org.hibernate.dialect.H2Dialect
  flyway:
    enabled: false  # use Hibernate DDL for tests
  data:
    redis:
      host: localhost
      port: 6370  # won't connect in unit tests; mock via @MockBean
  security:
    jwt:
      secret: test-secret-key-that-is-at-least-256-bits-long-for-testing
      expiration-ms: 3600000
      refresh-expiration-ms: 86400000

app:
  notification:
    mock-mode: true
  location:
    cache-ttl: 60
    stale-threshold: 30

logging:
  level:
    in.copmap: INFO
